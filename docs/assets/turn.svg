<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="Timeline of one turn: three messages gather, the turn is ready after a quiet window, the agent replies, WaGo marks read, types and sends two parts">
  <style>
    :root { --bg:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#cbd5e1; --card:#f8fafc; --wa2:#dcf8c6; --accent:#0ea5e9; --accent2:#e0f2fe; --violet:#8b5cf6; --amber:#f59e0b; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --ink:#e6edf3; --muted:#8b949e; --line:#30363d; --card:#161b22; --wa2:#103322; --accent:#38bdf8; --accent2:#0c2a3a; --violet:#a78bfa; --amber:#fbbf24; } }
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); } .xs { font-size: 11.5px; } .s { font-size: 13px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }
  </style>
  <rect width="960" height="300" fill="var(--bg)"/>

  <!-- lanes -->
  <text x="20" y="74" class="s muted">person</text>
  <text x="20" y="160" class="s muted">WaGo</text>
  <text x="20" y="244" class="s muted">agent</text>
  <line x1="90" y1="160" x2="940" y2="160" stroke="var(--line)" stroke-width="1.5"/>

  <!-- incoming -->
  <rect x="96" y="54" width="44" height="28" rx="11" fill="var(--card)" stroke="var(--line)"/><text x="118" y="72" text-anchor="middle" class="xs">hi</text>
  <rect x="150" y="54" width="148" height="28" rx="11" fill="var(--card)" stroke="var(--line)"/><text x="224" y="72" text-anchor="middle" class="xs">do you deliver on sunday?</text>
  <rect x="308" y="54" width="92" height="28" rx="11" fill="var(--card)" stroke="var(--line)"/><text x="354" y="72" text-anchor="middle" class="xs">🎤 voice 0:05</text>
  <path d="M118 84 V152 M224 84 V152 M354 84 V152" stroke="var(--line)" stroke-dasharray="3 4"/>

  <!-- collecting + quiet -->
  <rect x="112" y="148" width="356" height="24" rx="12" fill="var(--accent2)" stroke="var(--accent)"/>
  <text x="236" y="164" text-anchor="middle" class="xs">collecting · typing keeps it open</text>
  <rect x="400" y="148" width="68" height="24" rx="0" fill="var(--accent)" opacity="0.18"/>
  <text x="434" y="190" text-anchor="middle" class="xs muted">quiet 2.5 s</text>
  <text x="354" y="190" text-anchor="middle" class="xs muted">voice → text</text>

  <!-- turn.ready -->
  <circle cx="474" cy="160" r="6" fill="var(--accent)"/>
  <path d="M474 168 V222" stroke="var(--accent)" stroke-width="1.8"/>
  <text x="480" y="208" class="mono" fill="var(--accent)">turn.ready</text>
  <rect x="474" y="226" width="124" height="30" rx="10" fill="none" stroke="var(--violet)" stroke-width="1.4"/>
  <text x="536" y="246" text-anchor="middle" class="xs">context + messages</text>
  <path d="M598 241 H640 V172" stroke="var(--violet)" stroke-width="1.8" fill="none"/>
  <text x="646" y="208" class="mono" fill="var(--violet)">reply</text>

  <!-- delivery -->
  <text x="652" y="140" class="xs muted">✓✓ read</text>
  <rect x="700" y="150" width="58" height="20" rx="10" fill="var(--card)" stroke="var(--line)"/><text x="729" y="164" text-anchor="middle" class="xs muted">typing…</text>
  <rect x="812" y="150" width="58" height="20" rx="10" fill="var(--card)" stroke="var(--line)"/><text x="841" y="164" text-anchor="middle" class="xs muted">typing…</text>
  <path d="M758 160 V84 M870 160 V84" stroke="var(--line)" stroke-dasharray="3 4"/>
  <rect x="700" y="54" width="104" height="28" rx="11" fill="var(--wa2)"/><text x="752" y="72" text-anchor="middle" class="xs">Hi Ann! Yes 🙂</text>
  <rect x="812" y="54" width="128" height="28" rx="11" fill="var(--wa2)"/><text x="876" y="72" text-anchor="middle" class="xs">Card or cash, both ok</text>
  <text x="785" y="190" text-anchor="middle" class="xs muted">pause</text>

  <!-- interruption note -->
  <path d="M680 112 h250" stroke="var(--amber)" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="680" y="104" class="xs" fill="var(--amber)">a new message here stops the next part → turn.superseded</text>
</svg>
