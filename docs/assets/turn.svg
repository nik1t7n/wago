<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="Timeline of one turn: three messages gather, the turn is ready after a quiet window, the agent replies, WaGo marks read, types and sends two parts">
  <style>
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, sans-serif; fill: #0f172a; }
    .muted { fill: #64748b; } .xs { font-size: 11.5px; } .s { font-size: 13px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }
  
    .f-accent { fill: #0ea5e9; }
    .f-accent2 { fill: #e0f2fe; }
    .f-amber { fill: #f59e0b; }
    .f-bg { fill: #ffffff; }
    .f-card { fill: #f8fafc; }
    .f-violet { fill: #8b5cf6; }
    .f-wa2 { fill: #dcf8c6; }
    .s-accent { stroke: #0ea5e9; }
    .s-amber { stroke: #f59e0b; }
    .s-line { stroke: #cbd5e1; }
    .s-violet { stroke: #8b5cf6; }
    @media (prefers-color-scheme: dark) {
      text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, sans-serif; fill: #e6edf3; }
      .muted { fill: #8b949e; }
      .f-accent { fill: #38bdf8; }
      .f-accent2 { fill: #0c2a3a; }
      .f-amber { fill: #fbbf24; }
      .f-bg { fill: #0d1117; }
      .f-card { fill: #161b22; }
      .f-violet { fill: #a78bfa; }
      .f-wa2 { fill: #103322; }
      .s-accent { stroke: #38bdf8; }
      .s-amber { stroke: #fbbf24; }
      .s-line { stroke: #30363d; }
      .s-violet { stroke: #a78bfa; }
    }
  </style>
  <rect class="f-bg" width="960" height="300"/>

  <!-- lanes -->
  <text x="20" y="74" class="s muted">person</text>
  <text x="20" y="160" class="s muted">WaGo</text>
  <text x="20" y="244" class="s muted">agent</text>
  <line class="s-line" x1="90" y1="160" x2="940" y2="160" stroke-width="1.5"/>

  <!-- incoming -->
  <rect class="f-card s-line" x="96" y="54" width="44" height="28" rx="11"/><text x="118" y="72" text-anchor="middle" class="xs">hi</text>
  <rect class="f-card s-line" x="150" y="54" width="148" height="28" rx="11"/><text x="224" y="72" text-anchor="middle" class="xs">do you deliver on sunday?</text>
  <rect class="f-card s-line" x="308" y="54" width="92" height="28" rx="11"/><text x="354" y="72" text-anchor="middle" class="xs">🎤 voice 0:05</text>
  <path class="s-line" d="M118 84 V152 M224 84 V152 M354 84 V152" stroke-dasharray="3 4"/>

  <!-- collecting + quiet -->
  <rect class="f-accent2 s-accent" x="112" y="148" width="356" height="24" rx="12"/>
  <text x="236" y="164" text-anchor="middle" class="xs">collecting · typing keeps it open</text>
  <rect class="f-accent" x="400" y="148" width="68" height="24" rx="0" opacity="0.18"/>
  <text x="434" y="190" text-anchor="middle" class="xs muted">quiet 2.5 s</text>
  <text x="354" y="190" text-anchor="middle" class="xs muted">voice → text</text>

  <!-- turn.ready -->
  <circle class="f-accent" cx="474" cy="160" r="6"/>
  <path class="s-accent" d="M474 168 V222" stroke-width="1.8"/>
  <text x="480" y="208" class="mono f-accent">turn.ready</text>
  <rect class="s-violet" x="474" y="226" width="124" height="30" rx="10" fill="none" stroke-width="1.4"/>
  <text x="536" y="246" text-anchor="middle" class="xs">context + messages</text>
  <path class="s-violet" d="M598 241 H640 V172" stroke-width="1.8" fill="none"/>
  <text x="646" y="208" class="mono f-violet">reply</text>

  <!-- delivery -->
  <text x="652" y="140" class="xs muted">✓✓ read</text>
  <rect class="f-card s-line" x="700" y="150" width="58" height="20" rx="10"/><text x="729" y="164" text-anchor="middle" class="xs muted">typing…</text>
  <rect class="f-card s-line" x="812" y="150" width="58" height="20" rx="10"/><text x="841" y="164" text-anchor="middle" class="xs muted">typing…</text>
  <path class="s-line" d="M758 160 V84 M870 160 V84" stroke-dasharray="3 4"/>
  <rect class="f-wa2" x="700" y="54" width="104" height="28" rx="11"/><text x="752" y="72" text-anchor="middle" class="xs">Hi Ann! Yes 🙂</text>
  <rect class="f-wa2" x="812" y="54" width="128" height="28" rx="11"/><text x="876" y="72" text-anchor="middle" class="xs">Card or cash, both ok</text>
  <text x="785" y="190" text-anchor="middle" class="xs muted">pause</text>

  <!-- interruption note -->
  <path class="s-amber" d="M700 112 h240" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="940" y="104" text-anchor="end" class="xs f-amber">new message → the rest stops, turn.superseded</text>
</svg>
