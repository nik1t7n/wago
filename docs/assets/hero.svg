<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="WhatsApp on a phone, linked to WaGo: a WAHA-compatible API, an agent layer and a SQLite mirror; your agent receives turns and replies">
  <style>
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, sans-serif; fill: #0f172a; }
    .muted { fill: #64748b; }
    .h { font-weight: 700; font-size: 17px; }
    .s { font-size: 13px; }
    .xs { font-size: 11.5px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }
    .card { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
    .flow { stroke: #64748b; stroke-width: 1.6; fill: none; }
    .flowA { stroke: #0ea5e9; stroke-width: 2; fill: none; }
  
    .f-accent { fill: #0ea5e9; }
    .f-accent2 { fill: #e0f2fe; }
    .f-bg { fill: #ffffff; }
    .f-card { fill: #f8fafc; }
    .f-line { fill: #cbd5e1; }
    .f-muted { fill: #64748b; }
    .f-violet2 { fill: #ede9fe; }
    .f-wa2 { fill: #dcf8c6; }
    .s-accent { stroke: #0ea5e9; }
    .s-line { stroke: #cbd5e1; }
    .s-violet { stroke: #8b5cf6; }
    .s-wa { stroke: #25d366; }
    @media (prefers-color-scheme: dark) {
      text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, sans-serif; fill: #e6edf3; }
      .muted { fill: #8b949e; }
      .card { fill: #161b22; stroke: #30363d; stroke-width: 1.2; }
      .flow { stroke: #8b949e; stroke-width: 1.6; fill: none; }
      .flowA { stroke: #38bdf8; stroke-width: 2; fill: none; }
      .f-accent { fill: #38bdf8; }
      .f-accent2 { fill: #0c2a3a; }
      .f-bg { fill: #0d1117; }
      .f-card { fill: #161b22; }
      .f-line { fill: #30363d; }
      .f-muted { fill: #8b949e; }
      .f-violet2 { fill: #231a3d; }
      .f-wa2 { fill: #103322; }
      .s-accent { stroke: #38bdf8; }
      .s-line { stroke: #30363d; }
      .s-violet { stroke: #a78bfa; }
      .s-wa { stroke: #2bd46a; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="f-muted" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="f-accent" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="f-bg" width="960" height="400"/>

  <!-- phone -->
  <rect x="36" y="70" width="150" height="270" rx="26" class="card"/>
  <rect class="f-line" x="88" y="82" width="46" height="7" rx="3.5"/>
  <rect class="f-card s-line" x="52" y="108" width="104" height="30" rx="12"/>
  <text x="62" y="127" class="xs">hi! open today?</text>
  <rect class="f-card s-line" x="52" y="146" width="118" height="30" rx="12"/>
  <text x="62" y="165" class="xs">🎤 voice · 0:07</text>
  <rect class="f-wa2" x="76" y="190" width="96" height="30" rx="12"/>
  <text x="86" y="209" class="xs">Hi Ann! Yes,</text>
  <rect class="f-wa2" x="64" y="228" width="108" height="30" rx="12"/>
  <text x="74" y="247" class="xs">till 8 pm today 🙂</text>
  <text x="56" y="282" class="xs muted">typing…</text>
  <text x="111" y="364" text-anchor="middle" class="s muted">WhatsApp</text>

  <path d="M196 205 H262" class="flow" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="229" y="194" text-anchor="middle" class="xs muted">linked</text>
  <text x="229" y="224" text-anchor="middle" class="xs muted">device</text>

  <!-- wago -->
  <rect class="s-wa" x="272" y="42" width="400" height="320" rx="18" fill="none" stroke-width="2.2"/>
  <text x="296" y="76" class="h">WaGo</text>
  <text x="352" y="76" class="s muted">one Go binary · ~21 MB RAM</text>

  <rect x="292" y="94" width="360" height="62" rx="12" class="card"/>
  <text x="308" y="119" class="s" font-weight="600">WAHA-compatible REST · webhooks · WebSocket</text>
  <text x="308" y="141" class="xs muted">same paths, ids and webhooks as WAHA: just change the URL</text>

  <rect class="f-accent2 s-accent" x="292" y="166" width="360" height="104" rx="12" stroke-width="1.2"/>
  <text x="308" y="191" class="s" font-weight="600">Agent layer</text>
  <g class="xs">
    <rect class="f-bg s-accent" x="308" y="202" width="70" height="24" rx="12"/><text x="343" y="218" text-anchor="middle">turns</text>
    <rect class="f-bg s-accent" x="384" y="202" width="84" height="24" rx="12"/><text x="426" y="218" text-anchor="middle">delivery</text>
    <rect class="f-bg s-accent" x="474" y="202" width="86" height="24" rx="12"/><text x="517" y="218" text-anchor="middle">ownership</text>
    <rect class="f-bg s-accent" x="566" y="202" width="72" height="24" rx="12"/><text x="602" y="218" text-anchor="middle">outbox</text>
    <rect class="f-bg s-accent" x="308" y="234" width="104" height="24" rx="12"/><text x="360" y="250" text-anchor="middle">voice → text</text>
    <rect class="f-bg s-accent" x="418" y="234" width="70" height="24" rx="12"/><text x="453" y="250" text-anchor="middle">context</text>
    <rect class="f-bg s-accent" x="494" y="234" width="64" height="24" rx="12"/><text x="526" y="250" text-anchor="middle">policy</text>
    <rect class="f-bg s-accent" x="564" y="234" width="74" height="24" rx="12"/><text x="601" y="250" text-anchor="middle">replays</text>
  </g>

  <rect x="292" y="280" width="360" height="62" rx="12" class="card"/>
  <text x="308" y="305" class="s" font-weight="600">Mirror · SQLite + full-text search</text>
  <text x="308" y="327" class="xs muted">every message, reads in ms, works while offline</text>

  <!-- agents -->
  <path d="M682 196 H760" class="flowA" marker-end="url(#b)"/>
  <text x="721" y="186" text-anchor="middle" class="mono f-accent">turn.ready</text>
  <path d="M760 240 H682" class="flowA" marker-end="url(#b)"/>
  <text x="721" y="262" text-anchor="middle" class="mono f-accent">reply</text>

  <rect class="f-violet2 s-violet" x="770" y="120" width="160" height="96" rx="14" stroke-width="1.4"/>
  <text x="850" y="152" text-anchor="middle" class="s" font-weight="600">Your agent</text>
  <text x="850" y="174" text-anchor="middle" class="xs muted">Python · TS · Go · any</text>
  <text x="850" y="194" text-anchor="middle" class="xs muted">any model</text>
  <rect class="f-violet2 s-violet" x="770" y="232" width="160" height="66" rx="14" stroke-width="1.4"/>
  <text x="850" y="261" text-anchor="middle" class="s" font-weight="600">MCP clients</text>
  <text x="850" y="281" text-anchor="middle" class="xs muted">Claude · Codex · Cursor</text>
</svg>
