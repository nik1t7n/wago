<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>WaGo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234a5bd4'/%3E%3Cpath d='M9 12h14M9 17h9' stroke='white' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root {
  --bg:#f3f3f0; --panel:#ffffff; --chat:#eceae4; --ink:#1b1c1e; --ink2:#6b6d72; --ink3:#9b9ca1; --line:#e4e3dd;
  --hover:#f2f2ee; --sel:#e9ecfb; --accent:#4a5bd4; --accent-ink:#fff; --in:#ffffff; --out:#dfe4fb;
  --ok:#1f9d63; --warn:#c06a00; --bad:#d23b3b; --shadow:0 1px 2px rgba(0,0,0,.06), 0 4px 18px rgba(0,0,0,.06);
  --r:14px; --side:360px;
}
@media (prefers-color-scheme: dark) { :root {
  --bg:#0e0f11; --panel:#16171a; --chat:#101113; --ink:#ececef; --ink2:#9a9ca3; --ink3:#6d6f76; --line:#25262a;
  --hover:#1d1e22; --sel:#1f2440; --accent:#8c9bff; --accent-ink:#0e0f11; --in:#1d1e22; --out:#252c52;
  --ok:#3fcf8a; --warn:#ffa24d; --bad:#ff6b6b; --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 24px rgba(0,0,0,.35);
} }
* { box-sizing:border-box; }
html, body { height:100%; margin:0; }
body { background:var(--bg); color:var(--ink); font:14px/1.45 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; padding:0; }
input, textarea, select { font:inherit; color:inherit; }
[hidden] { display:none !important; }
svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none; }
.icon { width:36px; height:36px; display:grid; place-items:center; border-radius:10px; color:var(--ink2); }
.icon:hover { background:var(--hover); color:var(--ink); }
.btn { height:36px; padding:0 14px; border-radius:10px; background:var(--accent); color:var(--accent-ink); font-weight:600; display:inline-flex; align-items:center; gap:8px; }
.btn.ghost { background:var(--hover); color:var(--ink); }
.btn.danger { background:transparent; color:var(--bad); box-shadow:inset 0 0 0 1px var(--line); }
.btn:disabled { opacity:.5; cursor:default; }
.field { width:100%; height:38px; border-radius:10px; border:1px solid var(--line); background:var(--panel); padding:0 12px; outline:none; }
.field:focus { border-color:var(--accent); }

#app { display:grid; grid-template-columns:var(--side) 1fr; grid-template-rows:minmax(0, 1fr); height:100%; height:100dvh; }
#side, #main { min-height:0; }
#side { background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; min-width:0; padding-top:env(safe-area-inset-top); padding-left:env(safe-area-inset-left); }
.side-head { display:flex; align-items:center; gap:6px; padding:10px 10px 6px 14px; }
#sessBtn { display:flex; align-items:center; gap:8px; font-weight:650; font-size:16px; padding:6px 8px; margin-left:-8px; border-radius:10px; min-width:0; }
#sessBtn:hover { background:var(--hover); }
#sessBtn span.n { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dot { width:9px; height:9px; border-radius:50%; background:var(--ink3); flex:none; }
.dot.WORKING { background:var(--ok); } .dot.SCAN_QR_CODE, .dot.STARTING { background:var(--warn); } .dot.FAILED { background:var(--bad); }
.spacer { flex:1; }
#banner { margin:2px 12px 8px; padding:10px 12px; border-radius:12px; background:var(--sel); display:flex; align-items:center; gap:10px; font-weight:550; text-align:left; }
#banner .dot { width:8px; height:8px; }
.search { padding:2px 12px 10px; position:relative; }
.search svg { position:absolute; left:24px; top:11px; width:16px; height:16px; color:var(--ink3); }
.search input { width:100%; height:36px; border-radius:10px; border:0; background:var(--hover); padding:0 12px 0 34px; outline:none; }
.search input:focus { box-shadow:inset 0 0 0 1.5px var(--accent); background:var(--panel); }
#list { flex:1; overflow-y:auto; overscroll-behavior:contain; padding:0 6px 12px; }
.group-title { font-size:12px; font-weight:600; color:var(--ink2); padding:10px 10px 4px; letter-spacing:.02em; }
.item { display:flex; gap:12px; align-items:center; padding:8px 10px; border-radius:12px; cursor:pointer; min-width:0; }
.item:hover, .item:focus-visible { background:var(--hover); outline:none; } .item.on { background:var(--sel); }
.item .txt { flex:1; min-width:0; }
.item .row1 { display:flex; gap:8px; align-items:baseline; }
.item .name { font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.item .time { font-size:12px; color:var(--ink3); flex:none; }
.item .prev { color:var(--ink2); font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.item .prev mark { background:none; color:var(--accent); font-weight:600; }
.av { width:44px; height:44px; border-radius:50%; flex:none; position:relative; overflow:hidden; display:grid; place-items:center; font-weight:650; font-size:15px; color:#fff; }
.av img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.av.sm { width:36px; height:36px; font-size:13px; }
.more { text-align:center; color:var(--ink3); padding:12px; font-size:13px; }

#main { position:relative; min-width:0; display:flex; flex-direction:column; background:var(--chat); }
#empty { flex:1; display:grid; place-items:center; padding:24px; overflow:auto; }
.card { background:var(--panel); border-radius:18px; box-shadow:var(--shadow); padding:26px; width:min(420px, 100%); display:flex; flex-direction:column; gap:14px; align-items:center; text-align:center; }
.card h2 { margin:0; font-size:20px; letter-spacing:-.01em; }
.card .sub { color:var(--ink2); margin:0; }
#qr { width:264px; height:264px; border-radius:14px; background:#fff; padding:8px; image-rendering:pixelated; }
.code { font:700 30px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing:.12em; padding:10px 0; }
.row { display:flex; gap:8px; width:100%; }
.row .field { flex:1; }
.linkish { color:var(--accent); font-weight:550; }
.muted { color:var(--ink2); }

#chat { flex:1; display:flex; flex-direction:column; min-height:0; }
.chat-head { display:flex; align-items:center; gap:10px; padding:8px 12px; padding-top:calc(8px + env(safe-area-inset-top)); background:var(--panel); border-bottom:1px solid var(--line); min-height:58px; }
.chat-head .who { flex:1; min-width:0; cursor:default; }
.chat-head .who b { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:15px; }
.chat-head .who span { font-size:12px; color:var(--ink2); }
#back { display:none; }
#msgs { flex:1; overflow-y:auto; overscroll-behavior:contain; padding:12px 6% 8px; display:flex; flex-direction:column; gap:2px; }
.day { align-self:center; font-size:12px; font-weight:600; color:var(--ink2); background:var(--panel); padding:4px 10px; border-radius:999px; margin:12px 0 8px; box-shadow:var(--shadow); }
.m { display:flex; align-items:flex-end; gap:6px; max-width:min(78%, 640px); position:relative; }
.m.me { align-self:flex-end; flex-direction:row-reverse; }
.b { background:var(--in); border-radius:var(--r); padding:7px 10px 6px; box-shadow:0 1px 1px rgba(0,0,0,.05); min-width:0; position:relative; }
.m.me .b { background:var(--out); }
.m.tail .b { border-bottom-left-radius:4px; } .m.me.tail .b { border-bottom-left-radius:var(--r); border-bottom-right-radius:4px; }
.m + .m:not(.first) { margin-top:0; } .m.first { margin-top:6px; }
.b .who { font-size:12.5px; font-weight:650; margin-bottom:2px; }
.b .t { white-space:pre-wrap; overflow-wrap:anywhere; }
.b .t a { color:var(--accent); }
.b .meta { float:right; font-size:11px; color:var(--ink3); margin:6px 0 -2px 10px; white-space:nowrap; }
.b.deleted .t { opacity:.55; text-decoration:line-through; }
.quote { border-left:3px solid var(--accent); background:rgba(127,127,127,.09); border-radius:8px; padding:4px 8px; margin:2px 0 5px; font-size:13px; cursor:pointer; max-height:3.4em; overflow:hidden; }
.quote b { display:block; font-size:12px; color:var(--accent); }
.media { display:block; margin:-3px -6px 4px; border-radius:10px; max-width:min(360px, 100%); max-height:380px; object-fit:cover; background:rgba(127,127,127,.12); cursor:zoom-in; min-height:60px; min-width:120px; }
.sticker { max-width:150px; max-height:150px; background:none; cursor:default; }
video.media { cursor:default; }
audio { width:260px; max-width:100%; height:36px; margin:2px 0; }
.doc { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:10px; background:rgba(127,127,127,.1); margin:0 0 4px; color:inherit; text-decoration:none; min-width:0; }
.doc span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:550; }
.doc .sub { margin-left:auto; font-weight:400; font-size:12.5px; color:var(--ink2); }
button.doc { width:100%; text-align:left; font:inherit; }
.reacts { display:flex; gap:4px; flex-wrap:wrap; margin-top:-4px; margin-left:8px; position:relative; z-index:1; }
.m.me .reacts { justify-content:flex-end; margin-right:8px; }
.reacts span { background:var(--panel); border-radius:999px; padding:1px 7px; font-size:13px; box-shadow:var(--shadow); }
.acts { position:absolute; top:-14px; display:none; gap:2px; background:var(--panel); border-radius:10px; box-shadow:var(--shadow); padding:2px; z-index:2; }
.m:not(.me) .acts { left:calc(100% - 40px); } .m.me .acts { right:calc(100% - 40px); }
.acts button { width:30px; height:28px; display:grid; place-items:center; border-radius:8px; color:var(--ink2); }
.acts button:hover { background:var(--hover); color:var(--ink); }
.acts svg { width:17px; height:17px; }
@media (hover:hover) { .m:hover .acts { display:flex; } }
.flash .b { animation:flash 1.6s; }
@keyframes flash { 0%,40% { box-shadow:0 0 0 3px var(--accent); } }

#replyBar { display:flex; align-items:center; gap:10px; padding:8px 12px; background:var(--panel); border-top:1px solid var(--line); }
#replyBar .quote { flex:1; margin:0; cursor:default; }
#composer { display:flex; align-items:flex-end; gap:6px; padding:8px 10px; padding-bottom:calc(8px + env(safe-area-inset-bottom)); background:var(--panel); border-top:1px solid var(--line); }
#text { flex:1; resize:none; border:0; outline:none; background:var(--hover); border-radius:18px; padding:9px 14px; max-height:180px; min-height:38px; line-height:1.4; }
#sendBtn { width:38px; height:38px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; }
#sendBtn svg { width:18px; height:18px; }
#rec.on { color:var(--bad); }
#lock { padding:12px; padding-bottom:calc(12px + env(safe-area-inset-bottom)); background:var(--panel); border-top:1px solid var(--line); display:flex; gap:12px; align-items:center; justify-content:center; color:var(--ink2); }

.pop { position:fixed; background:var(--panel); border-radius:14px; box-shadow:var(--shadow), 0 0 0 1px var(--line); padding:6px; z-index:50; min-width:200px; max-width:calc(100vw - 24px); }
.pop button.mi { display:flex; width:100%; gap:10px; align-items:center; padding:9px 10px; border-radius:9px; text-align:left; }
.pop button.mi:hover { background:var(--hover); }
.pop button.mi.danger { color:var(--bad); }
.pop .emojis { display:flex; gap:2px; padding:2px; }
.pop .emojis button { font-size:22px; width:40px; height:40px; border-radius:10px; }
.pop .emojis button:hover { background:var(--hover); }
#scrim { position:fixed; inset:0; z-index:40; }
#scrim.dim { background:rgba(0,0,0,.35); }

#drawer { position:fixed; top:0; right:0; bottom:0; width:min(420px, 100%); background:var(--panel); z-index:45; box-shadow:var(--shadow); display:flex; flex-direction:column; padding-top:env(safe-area-inset-top); padding-right:env(safe-area-inset-right); }
#drawer header { display:flex; align-items:center; padding:12px 12px 8px 18px; font-weight:700; font-size:17px; }
#drawer .body { overflow-y:auto; padding:4px 18px 24px; display:flex; flex-direction:column; gap:22px; }
.sec h3 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink2); margin:0 0 8px; }
.kv { display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:13.5px; }
.kv dt { color:var(--ink2); } .kv dd { margin:0; overflow-wrap:anywhere; }
.btns { display:flex; gap:8px; flex-wrap:wrap; }
.switch { display:flex; align-items:center; gap:12px; justify-content:space-between; padding:10px 12px; border-radius:12px; background:var(--hover); }
.tg { width:44px; height:26px; border-radius:999px; background:var(--ink3); position:relative; transition:background .2s; flex:none; }
.tg::after { content:""; position:absolute; left:3px; top:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:transform .2s; }
.tg.on { background:var(--ok); } .tg.on::after { transform:translateX(18px); }
.hook { border:1px solid var(--line); border-radius:12px; padding:10px; display:flex; flex-direction:column; gap:8px; }
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.chips label { position:relative; font-size:12.5px; padding:4px 9px; border-radius:999px; background:var(--hover); cursor:pointer; user-select:none; }
.chips label:has(input:focus-visible) { outline:2px solid var(--accent); outline-offset:1px; }
.chips input { position:absolute; opacity:0; width:1px; height:1px; margin:0; } .chips input:checked + span { color:var(--accent); font-weight:650; }

#login { position:fixed; inset:0; z-index:60; background:var(--bg); display:grid; place-items:center; padding:20px; }
#lightbox { position:fixed; inset:0; z-index:70; background:rgba(0,0,0,.88); display:grid; place-items:center; cursor:zoom-out; }
#lightbox img { max-width:96vw; max-height:94vh; border-radius:6px; }
#toast { position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:var(--ink); color:var(--panel); padding:10px 16px; border-radius:12px; z-index:80; font-weight:550; max-width:calc(100vw - 32px); }

#empty .back { display:none; position:absolute; top:calc(8px + env(safe-area-inset-top)); left:8px; }
@media (max-width: 760px) {
  #app { grid-template-columns:1fr; }
  #main { display:none; }
  #app.open #side { display:none; }
  #app.open #main, #app.conn #main { display:flex; }
  #app.conn #side { display:none; }
  #back { display:grid; }
  #msgs { padding:10px 10px 6px; }
  .m { max-width:86%; }
  #empty .back { display:grid; }
}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="side-head">
      <button id="sessBtn"><span class="dot" id="sessDot"></span><span class="n" id="sessName">default</span>
        <svg viewBox="0 0 24 24" style="width:16px;height:16px"><path d="m6 9 6 6 6-6"/></svg></button>
      <span class="spacer"></span>
      <button class="icon" id="gear" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
    <button id="banner" hidden><span class="dot" id="bannerDot"></span><span id="bannerText"></span></button>
    <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search chats and messages" autocomplete="off"></div>
    <div id="list"></div>
  </aside>

  <main id="main">
    <div id="empty"><button class="icon back" id="connBack"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><div class="card" id="connCard"></div></div>
    <section id="chat" hidden>
      <header class="chat-head">
        <button class="icon" id="back"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
        <div class="av sm" id="chatAv"></div>
        <div class="who"><b id="chatName"></b><span id="chatSub"></span></div>
        <button class="icon" id="chatMenu" title="Chat menu"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>
      </header>
      <div id="msgs"></div>
      <div id="replyBar" hidden><div class="quote" id="replyQuote"></div><button class="icon" id="replyX"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
      <div id="lock" hidden></div>
      <form id="composer" autocomplete="off">
        <button type="button" class="icon" id="attach" title="Attach"><svg viewBox="0 0 24 24"><path d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg></button>
        <input type="file" id="file" hidden>
        <textarea id="text" rows="1" placeholder="Message"></textarea>
        <button type="button" class="icon" id="rec" title="Voice note"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        <button type="submit" id="sendBtn" title="Send"><svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
      </form>
    </section>
  </main>
</div>

<div id="drawer" hidden>
  <header><span>Settings</span><span class="spacer"></span><button class="icon" id="drawerX"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></header>
  <div class="body" id="drawerBody"></div>
</div>
<div id="login" hidden>
  <form class="card" id="loginForm">
    <h2>WaGo</h2>
    <input class="field" id="key" type="password" placeholder="API key" autocomplete="current-password">
    <button class="btn" style="width:100%;justify-content:center">Sign in</button>
    <p class="sub" id="loginErr"></p>
  </form>
</div>
<div id="lightbox" hidden><img id="lbImg" alt=""></div>
<div id="toast" hidden></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const S = { session: null, sessions: [], info: null, names: {}, chats: [], chatsDone: false, chatsLoading: false,
  chat: null, msgs: [], oldest: null, olderDone: false, loadingOlder: false, reply: null, editing: null, ws: null, query: "", health: null };
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

// ---------- helpers
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  return fill(e, ...kids);
}
// children, skipping null/false so conditional parts never show up as text
function fill(e, ...kids) {
  e.replaceChildren(...kids.flat().filter((k) => k != null && k !== false).map((k) => (k.nodeType ? k : String(k))));
  return e;
}
const svg = (d) => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("viewBox", "0 0 24 24"); s.innerHTML = d; return s; };
const ICON = {
  reply: '<path d="M9 17 4 12l5-5"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/>',
  smile: '<circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/>',
  more: '<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
  file: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/>',
  edit: '<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  trash: '<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',

function bubble(m, first) {

// ---------- composer
function guardSend() {
  if (!S.info || !S.info.config || !S.info.config.sending) { toast("Sending is off for this session"); return false; }
  if (S.info.status !== "WORKING") { toast("Not connected"); return false; }
  return true;
}
function renderComposerLock() {
  const lock = $("lock"), comp = $("composer");
  if (!S.chat) return;
  const sending = S.info && S.info.config && S.info.config.sending, working = S.info && S.info.status === "WORKING";
  fill(lock);
  if (!sending) {
    lock.append("Sending is off", el("button", { class: "btn ghost", onclick: () => setSending(true) }, "Turn on"));
  } else if (!working) {
    lock.append("Not connected");

  comp.hidden = !lock.hidden;
}
async function setSending(on) {
  try {
    const cfg = Object.assign({}, S.info.config, { sending: on });
    S.info = await api(`/api/sessions/${sp()}`, { method: "PUT", body: { config: cfg } });
    renderStatus(); if (!$("drawer").hidden) renderDrawer();
  } catch (err) { toast(err.message); }
}
function startReply(m) {

  $("replyBar").hidden = false; $("text").focus();
}

function startEdit(m) {

}
function cancelEdit() { if (S.editing) { S.editing = null; $("text").value = ""; autosize(); } $("replyBar").hidden = !S.reply; }
function autosize() { const t = $("text"); t.style.height = "auto"; t.style.height = Math.min(180, t.scrollHeight) + "px"; }
$("text").addEventListener("input", autosize);
$("text").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && matchMedia("(hover:hover)").matches) { e.preventDefault(); $("composer").requestSubmit(); }

$("composer").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = $("text").value.trim();
  if (!text || !S.chat || !guardSend()) return;
  const chat = S.chat.id;
  try {
    if (S.editing) {
      const m = S.editing;
      const fresh = await api(`/api/${sp()}/chats/${enc(chat)}/messages/${enc(m.id)}`, { method: "PUT", body: { text } });
      cancelEdit(); addMessages([fresh]); renderMessages(null, true); syncPreview(chat, bareId(fresh.id), fresh); return;
    }
    $("text").value = ""; autosize();
    const body = { session: S.session, chatId: chat, text };
    if (S.reply) body.reply_to = S.reply.id;
    cancelReply();
    const m = await api("/api/sendText", { method: "POST", body });
    if (S.chat && S.chat.id === chat) { if (!S.newestDone) await showLatest(); addMessages([m]); renderMessages(); $("msgs").scrollTop = $("msgs").scrollHeight; }
    bumpChat(m);
  } catch (err) { toast(err.message); if (!$("text").value) { $("text").value = text; autosize(); } }
});
$("attach").onclick = () => { if (guardSend()) $("file").click(); };

  const f = $("file").files[0]; $("file").value = "";
  if (f) await sendFile(f, $("text").value.trim());

function b64(blob) { return new Promise((ok, bad) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.onerror = bad; r.readAsDataURL(blob); }); }
async function sendFile(f, caption, asVoice) {

  const t = f.type || "application/octet-stream";
  const ep = asVoice ? "/api/sendVoice" : t.startsWith("image/") && !t.includes("svg") ? "/api/sendImage" : t.startsWith("video/") ? "/api/sendVideo" : "/api/sendFile";
  const chat = S.chat.id;
  toast("Sending…");
  try {
    const body = { session: S.session, chatId: chat, caption, convert: asVoice || (ep === "/api/sendVideo" && t !== "video/mp4"),
      file: { mimetype: t, filename: f.name || "file", data: await b64(f) } };
    if (S.reply) body.reply_to = S.reply.id;
    const m = await api(ep, { method: "POST", body });
    cancelReply(); if (caption) { $("text").value = ""; autosize(); }
    if (S.chat && S.chat.id === chat) { if (!S.newestDone) await showLatest(); addMessages([m]); renderMessages(); $("msgs").scrollTop = $("msgs").scrollHeight; }
    bumpChat(m); $("toast").hidden = true;
  } catch (err) { toast(err.message); }

// voice notes: tap to record, tap to send
let rec = null;
$("rec").onclick = async () => {
  if (rec) { rec.stop(); return; }
  if (!guardSend()) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const chunks = [];
    rec = new MediaRecorder(stream);
    rec.ondataavailable = (e) => chunks.push(e.data);
    rec.onstop = () => {
      stream.getTracks().forEach((t) => t.stop());
      $("rec").classList.remove("on"); rec = null;
      const blob = new Blob(chunks, { type: chunks[0] ? chunks[0].type : "audio/webm" });
      if (blob.size > 1000) sendFile(blob, "", true);
    };
    rec.start(); $("rec").classList.add("on"); toast("Recording… tap again to send");
  } catch (err) { toast("Microphone: " + err.message); rec = null; }
};

// ---------- live events
function bumpChat(m) {
  const i = S.chats.findIndex((c) => c.id === m.chatId);
  const c = i >= 0 ? S.chats.splice(i, 1)[0] : { id: m.chatId, name: null, isGroup: m.chatId.endsWith("@g.us") };
  c.lastMessage = m; c.conversationTimestamp = m.timestamp;
  S.chats.unshift(c);
  renderChats();

function connectWS() {
  if (S.ws) { S.ws.onclose = null; S.ws.close(); }
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws?session=${sp()}`);
  S.ws = ws;
  ws.onmessage = (e) => {
    let ev; try { ev = JSON.parse(e.data); } catch { return; }
    if (ev.session !== S.session) return;
    const p = ev.payload;
    if (ev.event === "session.status") { refreshInfo(); return; }
    if (ev.event === "message.any" && p && p.chatId) {
      bumpChat(p);
      if (S.chat && S.chat.id === p.chatId && S.newestDone) { addMessages([p]); renderMessages(); }
      return;
    }
    const chat = p && (p.fromMe ? p.to : p.from);
    if (ev.event === "message.edited") syncPreview(chat, p.editedMessageId, { body: p.body });
    if (ev.event === "message.revoked") syncPreview(chat, p.revokedMessageId, { revoked: true });
    if ((ev.event === "message.reaction" || ev.event === "message.edited" || ev.event === "message.revoked") && S.chat) {
      const target = p.reaction ? p.reaction.messageId : p.editedMessageId || p.revokedMessageId;
      const m = findMsg(target);
      if (m) refreshMessage(m);
    }
  };
  ws.onopen = async () => {
    if (!S.down) return;
    // back after a gap: whatever arrived meanwhile only reached the server
    await refreshInfo();
    if (S.query) runSearch(); else reloadChats();
    if (S.chat && S.newestDone) { await showLatest(); renderMessages(); }
  };
  ws.onclose = () => { if (S.ws !== ws) return; S.down = true; renderStatus(); setTimeout(() => { if (S.ws === ws) connectWS(); }, 3000); };
}

// ---------- settings
$("gear").onclick = () => { $("drawer").hidden = false; renderDrawer(); };
$("drawerX").onclick = () => { $("drawer").hidden = true; };
const EVENTS = ["message", "message.any", "message.reaction", "message.ack", "message.revoked", "message.edited", "session.status", "presence.update", "group.v2.join", "group.v2.update", "call.received"];

      return el("label", {}, cb, el("span", {}, ev === "*" ? "all" : ev));
    }));
    return el("div", { class: "hook" }, url, chips, key, el("button", { class: "linkish", style: "align-self:flex-start;color:var(--bad)", onclick: () => { hooks.splice(i, 1); drawHooks(); } }, "Remove"));
  }));
  drawHooks();
  const st = info.status;
  fill(body, el("div", { class: "sec" }, el("h3", {}, "Session"),
      el("dl", { class: "kv" }, el("dt", {}, "Name"), el("dd", {}, S.session), el("dt", {}, "Status"), el("dd", {}, st + (info.reason ? " · " + info.reason : "")),
        me ? [el("dt", {}, "Account"), el("dd", {}, (me.pushName ? me.pushName + " · " : "") + pretty(me.id))] : null),
      el("div", { class: "btns", style: "margin-top:12px" },
        st === "STOPPED" || st === "FAILED" ? el("button", { class: "btn", onclick: () => sessionAction("start").then(renderDrawer) }, "Connect") : el("button", { class: "btn ghost", onclick: () => sessionAction("stop").then(renderDrawer) }, "Disconnect"),
        el("button", { class: "btn ghost", onclick: () => sessionAction("restart").then(renderDrawer) }, "Restart"),
        me ? el("button", { class: "btn danger", onclick: async () => { if (await confirmPop("Unlink this device from WhatsApp?")) sessionAction("logout").then(renderDrawer); } }, "Unlink") : null)),
    el("div", { class: "sec" }, el("h3", {}, "Sending"),
      el("div", { class: "switch" }, el("span", {}, "Send, react, edit and delete from this session"),
        el("button", { class: "tg" + (cfg.sending ? " on" : ""), role: "switch", "aria-checked": String(!!cfg.sending), onclick: () => setSending(!cfg.sending) }))),
    el("div", { class: "sec" }, el("h3", {}, "Webhooks"), hookList,
      el("div", { class: "btns", style: "margin-top:10px" },
        el("button", { class: "btn ghost", onclick: () => { hooks.push({ url: "", events: ["message"] }); drawHooks(); } }, svg(ICON.plus), "Add"),
        el("button", { class: "btn", onclick: async () => {
          try { S.info = await api(`/api/sessions/${sp()}`, { method: "PUT", body: { config: Object.assign({}, cfg, { webhooks: hooks.filter((h) => h.url) }) } }); toast("Saved"); renderStatus(); renderDrawer(); }
          catch (err) { toast(err.message); } } }, "Save"))),
    S.health ? el("div", { class: "sec" }, el("h3", {}, "Server"),
      el("dl", { class: "kv" }, el("dt", {}, "Version"), el("dd", {}, S.health.version), el("dt", {}, "Memory"), el("dd", {}, S.health.heap_mb.toFixed(1) + " MB heap"),
        el("dt", {}, "Up"), el("dd", {}, Math.round(S.health.uptime / 60) + " min"), el("dt", {}, "Sessions"), el("dd", {}, Object.keys(S.health.sessions).length))) : null,
    el("div", { class: "sec" }, el("div", { class: "btns" },
      S.session !== "default" ? el("button", { class: "btn danger", onclick: async () => { if (!(await confirmPop(`Delete session ${S.session}? Its messages stay on disk.`))) return;
        try { await api(`/api/sessions/${sp()}`, { method: "DELETE" }); S.session = null; $("drawer").hidden = true; boot(); } catch (err) { toast(err.message); } } }, svg(ICON.trash), "Delete session") : null,
      el("button", { class: "btn ghost", onclick: async () => { await api("/api/auth/logout", { method: "POST" }).catch(() => {}); location.reload(); } }, svg(ICON.out), "Sign out"))));
}

// ---------- start
async function boot() {
  try {
    const me = await api("/api/auth/me");

  } catch (err) { if (err.message !== "signed out") toast(err.message); }
}
